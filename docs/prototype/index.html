<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HermesPush 智能数据推送平台 · 交互原型 v1.0</title>
<style>
:root{
  --primary:#3b6ef6; --primary-l:#ecf1fe; --success:#2ba471; --success-l:#e8f6f0;
  --warn:#d97706; --warn-l:#fdf3e3; --danger:#dc3545; --danger-l:#fdecee;
  --text:#1f2733; --text-2:#5e6b7f; --text-3:#96a1b3; --border:#e3e8f0; --bg:#f4f6fa;
  --side:#1e2a3a; --side-2:#27384d; --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
#app{display:flex;min-height:100vh}
/* ===== sidebar ===== */
#sidebar{width:220px;background:var(--side);color:#c6d0dd;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:18px 20px;color:#fff;font-size:17px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08)}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3b6ef6,#7aa5ff);display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-group{padding:12px 0 4px 20px;font-size:12px;color:#6b7a8d;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;border-left:3px solid transparent;font-size:14px}
.nav-item:hover{background:var(--side-2);color:#fff}
.nav-item.active{background:var(--side-2);color:#fff;border-left-color:var(--primary)}
.nav-item .ico{width:18px;text-align:center}
/* ===== main ===== */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50}
#topbar .crumb{color:var(--text-2)}
#topbar .crumb b{color:var(--text);font-weight:600}
.top-right{display:flex;align-items:center;gap:16px}
.env-tag{background:var(--warn-l);color:var(--warn);padding:3px 10px;border-radius:20px;font-size:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
#content{padding:20px 24px;flex:1}
/* ===== common ===== */
.page-title{font-size:18px;font-weight:600;margin-bottom:4px}
.page-sub{color:var(--text-2);margin-bottom:16px;font-size:13px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card-title{font-weight:600;font-size:15px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:1fr 1fr 1fr}
.grid.side{grid-template-columns:2fr 1fr}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;color:var(--text-2);font-weight:500;font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--border);background:#fafbfd;white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid #f0f3f8;vertical-align:middle}
.tbl tr:hover td{background:#f8faff}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;white-space:nowrap}
.b-run{background:var(--primary-l);color:var(--primary)} .b-ok{background:var(--success-l);color:var(--success)}
.b-fail{background:var(--danger-l);color:var(--danger)} .b-warn{background:var(--warn-l);color:var(--warn)}
.b-gray{background:#eef1f6;color:var(--text-2)} .b-part{background:#f3ecfd;color:#7c3aed}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}.btn.pri:hover{opacity:.88;color:#fff}
.btn.danger{color:var(--danger);border-color:#f3c1c6}.btn.danger:hover{background:var(--danger-l)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{color:var(--primary);cursor:pointer;font-size:13px}.lnk:hover{text-decoration:underline}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.inp,select.inp,textarea.inp{border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;background:#fff;color:var(--text);outline:none;font-family:inherit}
.inp:focus{border-color:var(--primary)}
textarea.inp{width:100%;resize:vertical}
label.fl{display:block;font-size:13px;color:var(--text-2);margin:12px 0 5px}
label.fl .req{color:var(--danger)}
.hint{font-size:12px;color:var(--text-3);margin-top:4px}
.checkbox-line{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
/* steps */
.steps{display:flex;margin-bottom:22px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 10px}
.step{flex:1;display:flex;align-items:center;gap:10px;justify-content:center;cursor:pointer}
.step .num{width:26px;height:26px;border-radius:50%;background:#e8edf5;color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.step.on .num{background:var(--primary);color:#fff}
.step.done .num{background:var(--success);color:#fff}
.step .lb{font-size:13px;color:var(--text-2)}
.step.on .lb{color:var(--text);font-weight:600}
.step .bar{flex:1;height:1px;background:var(--border);max-width:60px}
/* modal / drawer / toast */
.mask{position:fixed;inset:0;background:rgba(15,23,34,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center}
.modal{background:#fff;border-radius:10px;width:640px;max-width:94vw;margin-top:8vh;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.2)}
.modal.lg{width:860px}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.x{cursor:pointer;color:var(--text-3);font-size:18px;line-height:1}.x:hover{color:var(--text)}
.drawer-mask{position:fixed;inset:0;background:rgba(15,23,34,.4);z-index:100}
.drawer{position:fixed;top:0;right:0;bottom:0;width:760px;max-width:96vw;background:#fff;z-index:101;box-shadow:-8px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column}
.drawer-h{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600}
.drawer-b{padding:20px 22px;overflow-y:auto;flex:1}
#toast-root{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#fff;border:1px solid var(--border);border-left:4px solid var(--success);padding:11px 18px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);font-size:13.5px;animation:tin .2s}
.toast.err{border-left-color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
/* timeline */
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 14px 8px}
.tl-item:before{content:"";position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-l)}
.tl-item.ok:before{background:var(--success);box-shadow:0 0 0 2px var(--success-l)}
.tl-item.fail:before{background:var(--danger);box-shadow:0 0 0 2px var(--danger-l)}
.tl-t{font-size:12px;color:var(--text-3)}
.stage-bars{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:10px 0 6px}
.stage-bars div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;white-space:nowrap;overflow:hidden}
.stage-legend{display:flex;gap:16px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.err-card{background:var(--danger-l);border:1px solid #f3c1c6;border-radius:8px;padding:13px 15px;margin-top:12px}
.err-card .code{font-weight:700;color:var(--danger);font-size:13px}
.err-card .fix{margin-top:6px;color:var(--text-2);font-size:13px;line-height:1.7}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13.5px}
.kv .k{color:var(--text-2)}
.code-box{background:#0f172a;color:#d7e3f4;border-radius:8px;padding:13px 15px;font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;overflow-x:auto;white-space:pre}
.md-preview{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;font-size:13.5px;line-height:1.8}
.md-preview h4{margin:6px 0}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:9px 18px;cursor:pointer;font-size:14px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.pill-nav{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:13px;cursor:pointer;color:var(--text-2)}
.pill.on{background:var(--primary);border-color:var(--primary);color:#fff}
.watermark-demo{position:relative;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;padding:14px}
.watermark-demo .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.watermark-demo .wm span{transform:rotate(-24deg);color:rgba(59,110,246,.14);font-size:30px;font-weight:700;white-space:nowrap}
.stat-strip{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff;margin-bottom:16px}
.stat-strip .cell{flex:1;padding:14px 18px;border-right:1px solid var(--border)}
.stat-strip .cell:last-child{border-right:none}
.stat-strip .v{font-size:22px;font-weight:700}
.stat-strip .l{font-size:12.5px;color:var(--text-2);margin-top:2px}
.mono{font-family:Consolas,Menlo,monospace;font-size:12.5px}
.flex{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between}
.mt8{margin-top:8px}.mt14{margin-top:14px}.mb10{margin-bottom:10px}
.footer-note{color:var(--text-3);font-size:12px;text-align:center;padding:18px 0 30px}
/* login */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#1e2a3a 0%,#2c4a7c 60%,#3b6ef6 100%);display:flex;align-items:center;justify-content:center;z-index:400}
.login-box{width:380px;background:#fff;border-radius:14px;padding:36px 34px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.login-box h2{font-size:20px;margin-bottom:4px}
.login-box .sub{color:var(--text-2);font-size:13px;margin-bottom:22px}
.login-box .inp{width:100%;margin-bottom:12px;padding:10px 12px}
.login-box .btn{width:100%;justify-content:center;padding:10px;margin-top:6px}
.role-switch{display:flex;gap:8px;margin:14px 0 4px}
.role-switch .pill{flex:1;text-align:center}
</style>
</head>

    <h2>HermesPush</h2>
    <div class="sub">智能数据推送平台 · 交互原型 v1.2 · 默认简单模式（PRD 1.6 / FR-OPS-05）</div>

const $=s=>document.querySelector(s);
function badge(st){const m=EXEC_STATUS[st]||[st,'b-gray'];return `<span class="badge ${m[1]}">${m[0]}</span>`}

function toast(msg,err){const d=document.createElement('div');d.className='toast'+(err?' err':'');d.textContent=msg;$('#toast-root').appendChild(d);setTimeout(()=>d.remove(),2600)}
function modal(title,body,footer,lg){$('#modal-root').innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal${lg?' lg':''}"><div class="modal-h"><span>${title}</span><span class="x" onclick="closeModal()">✕</span></div><div class="modal-b">${body}</div>${footer?`<div class="modal-f">${footer}</div>`:''}</div></div>`}
function closeModal(){$('#modal-root').innerHTML=''}
function drawer(title,body){$('#drawer-root').innerHTML=`<div class="drawer-mask" onclick="closeDrawer()"></div><div class="drawer"><div class="drawer-h"><span>${title}</span><span class="x" onclick="closeDrawer()">✕</span></div><div class="drawer-b">${body}</div></div>`}
function closeDrawer(){$('#drawer-root').innerHTML=''}
function tbl(head,rows){return `<table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function can(f){ // 权限矩阵简化实现
  const A=ROLE==='ADMIN',D=ROLE==='DEVELOPER';
  const map={dsAdmin:A,taskEdit:A||D,tplEdit:A||D,chAdmin:A,audit:A,setting:A,sqlView:A||D,approve:A||D};
  return map[f]!==false;
}

  `<span class="lnk" onclick="toast('下载 v${v.v}')">下载</span> · <span class="lnk" onclick="toast('已以 v${v.v} 内容创建 v${t.ver+1}（回滚）')">回滚到此版</span>`]))}`)}

function execDetail(id){
 const e=EXECS.find(x=>x.id===id);if(!e)return;
 const canSql=can('sqlView');
 const stages=e.status==='WAIT_APPROVAL'
  ?[['排队','0.4s','#96a1b3',8],['查询','2.1s','#3b6ef6',20],['渲染','12.6s','#7c3aed',60],['等待审核','进行中…','#d97706',12]]
  :[['排队','0.3s','#96a1b3',4],['查询 ds1','2.3s','#3b6ef6',18],['渲染 A1/A2','9.7s','#7c3aed',30],['转图 A3','18.4s','#0ea5e9',38],['推送×2渠道','3.5s','#2ba471',10]];
 drawer(`执行详情 · ${e.id}`,`
 <div class="flex mb10">${badge(e.status)}<span class="badge b-gray">${e.trig}</span><span class="hint">任务：${e.task} · 版本 ${e.ver} · 节点 ${e.node}</span></div>
 <div class="kv mb10">
  <span class="k">触发时间</span><span>${e.fire}</span><span class="k">业务日期</span><span>${e.biz}</span>
  <span class="k">生效参数</span><span class="mono">bizDate=${e.biz==='—'?'2026-09-20':e.biz} · branchId=100 · threshold=1000</span>
  <span class="k">总耗时</span><span>${e.cost}</span><span class="k">数据行数</span><span>${e.rows}</span>
 </div>
 ${e.note?`<div class="card" style="background:#fafbfd;margin-bottom:12px"><span class="hint">${e.note}</span></div>`:''}
 <div class="card" style="margin-bottom:12px"><div class="card-title">阶段时间线（FR-EXE-06）</div>
  <div class="stage-bars">${stages.map(s=>`<div style="width:${s[3]}%;background:${s[2]}" title="${s[0]} ${s[1]}">${s[0]}</div>`).join('')}</div>
  <div class="stage-legend">${stages.map(s=>`<span><i class="dot" style="background:${s[2]}"></i>${s[0]} ${s[1]}</span>`).join('')}</div>
 </div>
 ${e.err?`<div class="err-card"><span class="code">${e.err.code}</span> <b>${e.err.msg}</b><div class="fix">修复建议：${e.err.fix}</div></div>`:''}
 ${e.fanout?`<div class="card mt14" style="margin-bottom:12px"><div class="card-title">FANOUT 子执行（${e.fanout.ok}/${e.fanout.total} 成功）</div>
  <div class="hint">失败行：${e.fanout.failRow}</div><div class="flex mt8"><button class="btn sm" onclick="go('fanout')">父子视图</button><button class="btn sm pri" onclick="toast('仅重跑失败子执行已入队')">重跑失败行</button></div></div>`:''}
 <div class="card mt14" style="margin-bottom:12px"><div class="card-title">产物</div>
  ${tbl(['产物','类型','引擎','行数','大小','存储','操作'],[
   ['A1 摘要','MARKDOWN','Freemarker','—','1.2KB','hp://oss-main/artifacts/2026/09/21/101/'+e.id.slice(-3)+'/a1.md',`<span class="lnk" onclick="toast('下载（presignedUrl 5分钟有效）')">下载</span>`],
   ['A2 明细','EXCEL','EasyExcel','1,284','214KB','hp://oss-main/…/a2.xlsx','<span class="lnk">下载</span>'],
   ['A3 表格图','IMAGE','HTML_SHOT','200(截断)','486KB','hp://oss-main/…/a3.png','<span class="lnk">下载</span>']])}
 </div>
 <div class="card" style="margin-bottom:12px"><div class="card-title">渠道推送明细（幂等键：执行ID+渠道+产物）</div>
  ${tbl(['渠道','产物→消息','状态','重试','错误'],[
   ['销售一大群机器人','A1→markdown','<span class="badge b-ok">成功</span>','0','—'],
   ['销售一大群机器人','A3→image','<span class="badge b-ok">成功</span>','0','—'],
   ['管理层日报群','A2→file','<span class="badge b-ok">成功</span>','0','media_id 缓存命中'],
   ...(e.err&&e.id==='E20260921002'?[['钉钉-华西部报表群','A1→markdown','<span class="badge b-fail">失败</span>','1/3','PUSH-011 限流等待超时']]:[])])}
 </div>
 ${canSql?`<div class="card"><div class="card-title">SQL 与审计</div>
  <div class="code-box">SELECT branch_name, cust_name, amount, dt
FROM sales_order
WHERE dt = '2026-09-20' AND branch_id = 100   -- #{} 已绑定，审计存原文+参数</div>
  <div class="hint mt8">scene=EXEC · 返回 1,284 行 · 耗时 2.3s · 操作者 exec:${e.id} · IP 10.20.8.5(node-2)</div></div>`
 :`<div class="card"><div class="hint">VIEWER 角色不展示 SQL 原文、参数与数据源信息（FR-SEC-06）</div></div>`}`);
}

function render(){const f=PAGES[PAGE]||PAGES.dash;$('#content').innerHTML=f();}
function doLogin(){
 ROLE=document.querySelector('#role-switch .pill.on').dataset.role;
 $('#login').style.display='none';$('#app').style.display='flex';
 $('#whoami').textContent=ROLES[ROLE]+' · '+(ROLE==='ADMIN'?'admin':ROLE==='DEVELOPER'?'wangxy':'zhoumin');
 $('#avatar').textContent=(ROLE==='ADMIN'?'A':ROLE==='DEVELOPER'?'王':'周');
 PAGE=(MODE==='simple')?'home':'dash';renderNav();render();
 toast('已以「'+ROLES[ROLE]+'」角色登录（简单模式，可切专家模式）');
}
function logout(){location.reload()}
document.querySelectorAll('#role-switch .pill').forEach(p=>p.onclick=()=>{
 document.querySelectorAll('#role-switch .pill').forEach(x=>x.classList.remove('on'));p.classList.add('on')});
